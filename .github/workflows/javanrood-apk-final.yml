name: Javanrood Full Audit Clean APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "buildozer.spec"
      - "requirements-dev.txt"
      - ".github/workflows/javanrood-apk-final.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 100

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate clean project identity
        shell: bash
        run: |
          set -euo pipefail
          test -f buildozer.spec
          test -f src/main.py
          test -f src/javanrood.kv
          grep -Eq '^package\.name\s*=\s*javanroodcommitteeclientclean\s*$' buildozer.spec
          grep -Eq '^version\s*=\s*1\.2\.0\s*$' buildozer.spec
          grep -Eq '^p4a\.branch\s*=\s*v2026\.05\.09\s*$' buildozer.spec
          grep -Eq '^p4a\.commit\s*=\s*58d2114\s*$' buildozer.spec
          grep -Eq '^requirements\s*=.*python3==3\.12\.8.*hostpython3==3\.12\.8.*filetype.*cryptography==46\.0\.3' buildozer.spec
          grep -q 'BUILD_ID = "20260730-full-audit-clean-01"' src/main.py
          ! test -e src/javanrood_app.py
          echo "Clean package: ir.javanrood.javanroodcommitteeclientclean"
          echo "Build ID: 20260730-full-audit-clean-01"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git zip unzip autoconf automake autopoint libtool libtool-bin             m4 gettext pkg-config zlib1g-dev libncurses5-dev             libncursesw5-dev cmake ninja-build libffi-dev libssl-dev             libsqlite3-dev liblzma-dev build-essential ccache             xvfb libgl1-mesa-dev libgles2-mesa-dev

      - name: Install host test and Android build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel build packaging
          python -m pip install -r requirements-dev.txt
          python -m pip install             "buildozer==1.5.0"             "cython==0.29.37"             virtualenv
          python --version
          buildozer --version

      - name: Run complete non-UI source audit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          export HOME="$RUNNER_TEMP/javanrood-host-home"
          mkdir -p "$HOME"

          python - <<'PY'
          from pathlib import Path
          import ast
          import tempfile

          for path in sorted(Path("src").glob("*.py")):
              ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))

          from client_exchange_core import password_hash, verify_password
          from client_license_store import LicenseStore
          from jalali_utils import gregorian_to_jalali, jalali_to_gregorian
          from rtl_text import fa

          password = "Javanrood-Test-123"
          encoded = password_hash(password)
          assert encoded.startswith("$argon2id$")
          assert verify_password(password, encoded)
          assert not verify_password(password + "x", encoded)

          store = LicenseStore()
          state = store.validate(update_clock=False)
          assert state["status"] == "not_activated"

          assert gregorian_to_jalali(2026, 7, 30) == (1405, 5, 8)
          assert jalali_to_gregorian(1405, 5, 8) == (2026, 7, 30)
          assert isinstance(fa("آزمون جوانرود"), str)

          print("Non-UI source audit passed")
          PY

      - name: Run Kivy and KV startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          export HOME="$RUNNER_TEMP/javanrood-kivy-home"
          export KIVY_NO_ARGS=1
          export JAVANROOD_SMOKE_TEST=1
          export JAVANROOD_SMOKE_MARKER="$RUNNER_TEMP/javanrood-smoke-ok.txt"
          mkdir -p "$HOME"

          rm -f "$JAVANROOD_SMOKE_MARKER"
          timeout 45s xvfb-run -a python src/main.py 2>&1 | tee host_ui_smoke.log
          test -f "$JAVANROOD_SMOKE_MARKER"
          cat "$JAVANROOD_SMOKE_MARKER"
          grep -q 'OK|20260730-full-audit-clean-01' "$JAVANROOD_SMOKE_MARKER"

      - name: Remove every stale Android build cache
        run: |
          rm -rf "$GITHUB_WORKSPACE/.buildozer"
          rm -rf "$HOME/.buildozer"
          rm -rf "$GITHUB_WORKSPACE/bin"
          rm -rf "$GITHUB_WORKSPACE/apk-output"
          rm -f "$GITHUB_WORKSPACE/buildozer_build.log"
          rm -f "$GITHUB_WORKSPACE/apk_contents.txt"

      - name: Build clean debug APK
        id: build_apk
        shell: bash
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"

          set +e
          yes | buildozer -v android debug 2>&1 | tee buildozer_build.log
          STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "Build failed with exit code $STATUS"
            exit "$STATUS"
          fi

          mkdir -p apk-output
          find bin -maxdepth 1 -type f -name '*.apk' -exec cp -v {} apk-output/ \;
          APK="$(find apk-output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Audit actual APK and Python runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APK="${{ steps.build_apk.outputs.apk_path }}"
          test -f "$APK"

          unzip -l "$APK" | tee apk_contents.txt

          grep -q 'lib/arm64-v8a/libmain.so' apk_contents.txt
          grep -q 'lib/arm64-v8a/libpython3.12.so' apk_contents.txt
          grep -q 'lib/arm64-v8a/libpybundle.so' apk_contents.txt

          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import zipfile

          host_candidates = [
              path
              for path in Path(".buildozer").rglob("python3")
              if path.is_file()
              and "hostpython3" in str(path)
              and os.access(path, os.X_OK)
          ]
          if not host_candidates:
              raise SystemExit("ERROR: built hostpython3 executable not found")

          hostpython = host_candidates[0]
          expected_magic = subprocess.check_output(
              [
                  str(hostpython),
                  "-c",
                  "import importlib.util; print(importlib.util.MAGIC_NUMBER.hex())",
              ],
              text=True,
          ).strip()
          print("Built hostpython:", hostpython)
          print("Expected bytecode magic:", expected_magic)

          stdlib_zips = list(Path(".buildozer").rglob("stdlib.zip"))
          if not stdlib_zips:
              raise SystemExit("ERROR: stdlib.zip not found")

          required = (
              "encodings/__init__.pyc",
              "encodings/utf_8.pyc",
              "codecs.pyc",
          )

          valid_stdlib = None
          for stdlib_path in stdlib_zips:
              with zipfile.ZipFile(stdlib_path) as archive:
                  normalized = {
                      name.lstrip("./"): name
                      for name in archive.namelist()
                  }
                  if not all(name in normalized for name in required):
                      continue

                  for name in required:
                      magic = archive.read(normalized[name])[:4].hex()
                      if magic != expected_magic:
                          raise SystemExit(
                              f"ERROR: {name} has bytecode magic {magic}, "
                              f"expected {expected_magic}"
                          )

                  valid_stdlib = stdlib_path
                  break

          if valid_stdlib is None:
              raise SystemExit(
                  "ERROR: no stdlib.zip contains all filesystem codec modules"
              )

          print("Validated stdlib:", valid_stdlib)

          filetype_files = [
              path
              for path in Path(".buildozer").rglob("*")
              if path.is_file()
              and path.name in ("__init__.py", "__init__.pyc")
              and path.parent.name == "filetype"
          ]
          if not filetype_files:
              raise SystemExit("ERROR: filetype package not installed")

          print("filetype package:", filetype_files[0])
          print("APK and Python runtime bundle audit passed")
          PY

      - name: Show build failure details
        if: failure()
        run: |
          echo "----- Last 400 Buildozer lines -----"
          tail -n 400 buildozer_build.log || true
          echo "----- Host UI smoke log -----"
          cat host_ui_smoke.log || true

      - name: Upload all audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javanrood-full-audit-logs
          path: |
            buildozer_build.log
            host_ui_smoke.log
            apk_contents.txt
          if-no-files-found: warn

      - name: Upload clean APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: javanrood-full-audit-clean-apk
          path: apk-output/*.apk
          if-no-files-found: error
