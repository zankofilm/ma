name: Javanrood Runtime Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      SETUPTOOLS_USE_DISTUTILS: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize and lock build configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # GitHub may have saved the supplied spec under a longer filename.
          # Recover it automatically and create the required exact filename.
          if [ ! -f buildozer.spec ]; then
            mapfile -t SPECS < <(find . -maxdepth 2 -type f -name '*.spec' \
              -not -path './.buildozer/*' | sort)

            if [ "${#SPECS[@]}" -eq 0 ]; then
              echo "ERROR: No .spec file exists in the repository."
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            SELECTED_SPEC=""
            for candidate in "${SPECS[@]}"; do
              if grep -Eq '^requirements[[:space:]]*=.*python3==3\.12' "$candidate"; then
                SELECTED_SPEC="$candidate"
                break
              fi
            done

            if [ -z "$SELECTED_SPEC" ]; then
              SELECTED_SPEC="${SPECS[0]}"
            fi

            cp "$SELECTED_SPEC" buildozer.spec
            echo "Recovered buildozer.spec from: $SELECTED_SPEC"
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          text = path.read_text(encoding="utf-8")

          lines = text.splitlines()
          output = []
          requirements_found = False
          ndk_found = False
          minapi_found = False
          ndk_api_found = False
          p4a_branch_found = False
          p4a_commit_found = False

          for line in lines:
              if re.match(r"^\s*requirements\s*=", line):
                  value = line.split("=", 1)[1].strip()
                  packages = [item.strip() for item in value.split(",") if item.strip()]
                  packages = [
                      item for item in packages
                      if not re.match(
                          r"^(hostpython3|python3|argon2-cffi|cryptography)"
                          r"(==.*|>=.*|<=.*|~=.*|!=.*)?$",
                          item,
                      )
                  ]
                  packages = [
                      "python3==3.12.8",
                      "hostpython3==3.12.8",
                      "cryptography==46.0.3",
                  ] + packages
                  line = "requirements = " + ",".join(packages)
                  requirements_found = True

              if re.match(r"^\s*android\.ndk\s*=", line):
                  line = "android.ndk = 28c"
                  ndk_found = True

              if re.match(r"^\s*android\.minapi\s*=", line):
                  line = "android.minapi = 26"
                  minapi_found = True

              if re.match(r"^\s*android\.ndk_api\s*=", line):
                  line = "android.ndk_api = 26"
                  ndk_api_found = True

              if re.match(r"^\s*p4a\.branch\s*=", line):
                  line = "p4a.branch = master"
                  p4a_branch_found = True

              if re.match(r"^\s*p4a\.commit\s*=", line):
                  line = "p4a.commit = a9b902be53f679cb3585db8b3366f2805ad7bb76"
                  p4a_commit_found = True

              output.append(line)

          if not requirements_found:
              raise SystemExit("ERROR: requirements line not found in buildozer.spec")

          if not ndk_found:
              output.append("android.ndk = 28c")

          if not minapi_found or not ndk_api_found or not p4a_branch_found or not p4a_commit_found:
              try:
                  buildozer_index = next(
                      index for index, value in enumerate(output)
                      if value.strip().lower() == "[buildozer]"
                  )
              except StopIteration:
                  raise SystemExit("ERROR: [buildozer] section not found")

              missing = []
              if not minapi_found:
                  missing.append("android.minapi = 26")
              if not ndk_api_found:
                  missing.append("android.ndk_api = 26")
              if not p4a_branch_found:
                  missing.append("p4a.branch = master")
              if not p4a_commit_found:
                  missing.append("p4a.commit = a9b902be53f679cb3585db8b3366f2805ad7bb76")

              output[buildozer_index:buildozer_index] = missing + [""]

          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

          test -f buildozer.spec
          test -f src/main.py
          grep -E '^requirements|^android\.(ndk|minapi|ndk_api)|^p4a\.(branch|commit)' buildozer.spec
          grep -Eq '^android\.minapi\s*=\s*26\s*$' buildozer.spec
          grep -Eq '^android\.ndk_api\s*=\s*26\s*$' buildozer.spec
          grep -Eq '^p4a\.branch\s*=\s*master\s*$' buildozer.spec
          grep -Eq '^p4a\.commit\s*=\s*a9b902be53f679cb3585db8b3366f2805ad7bb76\s*$' buildozer.spec
          grep -Eq '^requirements\s*=\s*python3==3.12.8,hostpython3==3.12.8,cryptography==46\.0\.3(,|$)' buildozer.spec
          ! grep -Eq '(^|,)argon2-cffi([<>=~!].*)?(,|$)' buildozer.spec
          ! grep -R -nE '^(from argon2|import argon2)' src

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake autopoint libtool libtool-bin \
            m4 gettext pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake ninja-build libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel
          python -m pip install "buildozer==1.5.0" "cython==0.29.37" virtualenv
          python -c "import distutils; print(distutils.__file__)"
          buildozer --version

      - name: Verify Argon2 compatibility
        run: |
          python -m pip install "cryptography==46.0.3"
          PYTHONPATH=src python - <<'PY'
          from client_exchange_core import password_hash, verify_password

          password = "Javanrood-Test-123"
          encoded = password_hash(password)

          assert encoded.startswith("$argon2id$")
          assert verify_password(password, encoded)
          assert not verify_password(password + "x", encoded)
          print("Argon2id compatibility test passed")
          PY

      - name: Remove all stale Android build files
        run: |
          rm -rf "$GITHUB_WORKSPACE/.buildozer"
          rm -rf "$HOME/.buildozer"
          rm -rf "$GITHUB_WORKSPACE/bin"
          rm -f "$GITHUB_WORKSPACE/buildozer_build.log"

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"

          set +e
          yes | buildozer -v android debug 2>&1 | tee buildozer_build.log
          STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "Build failed with exit code $STATUS"
            exit "$STATUS"
          fi

          mkdir -p apk-output
          find bin -maxdepth 1 -type f -name '*.apk' -exec cp -v {} apk-output/ \;

          test -n "$(find apk-output -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Validate Python 3.12 runtime bundle
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          python - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile
          import sys

          expected_p4a = "a9b902be53f679cb3585db8b3366f2805ad7bb76"

          p4a_dirs = [
              path for path in Path(".buildozer").rglob("python-for-android")
              if path.is_dir() and (path / ".git").exists()
          ]
          if not p4a_dirs:
              raise SystemExit("ERROR: python-for-android checkout was not found")

          p4a_dir = p4a_dirs[0]
          actual_p4a = subprocess.check_output(
              ["git", "-C", str(p4a_dir), "rev-parse", "HEAD"],
              text=True,
          ).strip()
          print("python-for-android HEAD:", actual_p4a)
          if actual_p4a != expected_p4a:
              raise SystemExit(
                  f"ERROR: unexpected p4a commit {actual_p4a}; "
                  f"expected {expected_p4a}"
              )

          stdlib_zips = list(Path(".buildozer").rglob("stdlib.zip"))
          if not stdlib_zips:
              raise SystemExit("ERROR: no Python stdlib.zip was produced")

          required = (
              "encodings/__init__.pyc",
              "encodings/utf_8.pyc",
              "codecs.pyc",
          )

          validated = []
          for stdlib_path in stdlib_zips:
              with zipfile.ZipFile(stdlib_path) as archive:
                  name_map = {
                      name.lstrip("./"): name
                      for name in archive.namelist()
                  }
                  if not all(name in name_map for name in required):
                      continue

                  magic_values = {
                      archive.read(name_map[name])[:4]
                      for name in required
                  }
                  if len(magic_values) != 1:
                      raise SystemExit(
                          f"ERROR: mixed Python bytecode magic in {stdlib_path}"
                      )

                  magic = next(iter(magic_values))
                  if not magic or len(magic) != 4:
                      raise SystemExit(
                          f"ERROR: invalid .pyc header in {stdlib_path}"
                      )

                  validated.append((stdlib_path, magic.hex()))

          if not validated:
              print("Discovered stdlib archives:")
              for path in stdlib_zips:
                  print(" -", path)
              raise SystemExit(
                  "ERROR: stdlib.zip does not contain the filesystem "
                  "codec modules required for Python startup"
              )

          for path, magic in validated:
              print("Validated Python stdlib:", path)
              print("Bytecode magic:", magic)
              print("Required codecs: present")

          print("Python 3.12 runtime bundle validation passed")
          PY

      - name: Show build error
        if: failure()
        run: |
          echo "----- Last 300 lines -----"
          tail -n 300 buildozer_build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javanrood-build-log
          path: buildozer_build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: javanrood-runtime-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
