name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python 3.12
        run: python --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev \
            libssl-dev automake build-essential ccache

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-py312-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-py312-

      - name: Cache Buildozer local build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-py312-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-local-py312-

      - name: Install Buildozer and Python build tools
        env:
          SETUPTOOLS_USE_DISTUTILS: local
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "cython<3.0" virtualenv
          python -c "import distutils; print('distutils available:', distutils.__file__)"

      # نکته مهم: «set -o pipefail» ضروری است. بدون آن، exit code این
      # مرحله برابر با exit code آخرین دستور در pipe (یعنی «tee») است
      # نه exit code واقعی «buildozer». نتیجه‌اش این بود که حتی وقتی
      # buildozer با خطای بحرانی از کار می‌افتاد، این مرحله باز هم سبز
      # ثبت می‌شد، مرحله‌ی بعدی («Upload APK artifact» با
      # «if: success()») هم اجرا می‌شد، ولی هیچ APK ای برای آپلود پیدا
      # نمی‌کرد — دقیقاً همان چیزی که در اجرای قبلی رخ داد.
      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer_build.log

      - name: Show tail of build log on failure
        if: failure()
        run: |
          echo "----- انتهای لاگ ساخت (۲۰۰ خط آخر) -----"
          tail -n 200 buildozer_build.log || true

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_build.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: javanrood-client-debug-apk
          path: bin/*.apk
          if-no-files-found: error
