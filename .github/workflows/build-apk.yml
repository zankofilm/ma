name: Build Javanrood Native Android Phase 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "keystore/**"
      - "keystore.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --update || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Validate native project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/ir/javanrood/client/MainActivity.kt
          test -f app/src/main/java/ir/javanrood/client/NativeCrashStore.kt
          test -f app/src/main/java/ir/javanrood/client/activation/CryptoCompat.kt
          test -f app/src/test/resources/python_request_fixture.jrr
          test -f app/src/test/resources/python_activation_fixture.jra
          test -f keystore/javanrood-development.jks
          grep -q 'applicationId = "ir.javanrood.client"' app/build.gradle.kts
          grep -q 'minSdk = 26' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          ! grep -R -n -E 'python-for-android|buildozer|from kivy|import kivy' app/src/main
          echo "Native Android project structure validated"

      - name: Run activation compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      - name: Build signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "ir.javanrood.client"
          apkanalyzer manifest min-sdk "$APK" \
            | grep -Fx "26"
          apkanalyzer files list "$APK" \
            | grep -q 'classes.dex'
          ! apkanalyzer files list "$APK" \
            | grep -E 'libpython|libSDL|kivy|python3'
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: javanrood-native-phase1-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javanrood-native-phase1-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
